name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Install server deps
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html
          test -d dist/assets

      - name: Verify server starts (smoke test)
        env:
          JWT_SECRET: ci-dummy-secret-64-chars-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DB_HOST: 127.0.0.1
          DB_NAME: saiful_studios_test
          CORS_ORIGIN: http://localhost:5173
        run: |
          cd server
          node -e "require('./server.js').listen ? null : null" 2>&1 | head -n 5 || true
